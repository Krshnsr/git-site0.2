<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find a Gift | ThoughtfulGifts</title>
  <!-- Optional: Bootstrap if you rely on it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Your site stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="brand"><a href="index.html">Thoughtful<span>Gifts</span></a></div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="form.html" class="active">Find a Gift</a>
    </nav>
  </header>

  <main class="container">
    <!-- Put the existing form markup below -->
    <form id="gift-search-form">
      <h4 class="form-section-title">1. Recipient Details</h4>

      <div class="form-row">
        <div class="form-group">
          <label for="occasion">Occasion *</label>
          <select id="occasion" required>
            <option value="">Select occasion</option>
            <option value="Birthday">Birthday</option>
            <option value="Anniversary">Anniversary</option>
            <option value="Retirement">Retirement</option>
          </select>
        </div>

        <div class="form-group">
          <label for="relationship">Relationship *</label>
          <select id="relationship" required>
            <option value="">Select relationship</option>
            <option value="Spouse / Partner">Spouse / Partner</option>
            <option value="Parent / In-law">Parent / In-law</option>
            <option value="Sibling">Sibling</option>
            <option value="Close Friend">Close Friend</option>
            <option value="Colleague / Mentor">Colleague / Mentor</option>
            <option value="unnamed">Unnamed</option>
            
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="recipient-name">Recipient's Name / Nickname *</label>
          <input type="text" id="recipient-name" placeholder="e.g. Rahul or Priya" required />
        </div>

        <div class="form-group">
          <label for="max-budget">Max Budget (₹ / Currency) *</label>
          <input type="number" id="max-budget" placeholder="5000" min="100" required />
        </div>
      </div>

      <div class="form-group">
        <label for="ai-provider">AI recommendation provider</label>
        <select id="ai-provider">
          <option value="gemini">Google Gemini</option>
          <option value="openai">OpenAI (ChatGPT)</option>
        </select>
        <small class="form-help">The selected service generates your gift ideas. Its API key must be configured on the server.</small>
      </div>

      <div class="form-group">
        <label for="interests">Interests, Passions & Quirks *</label>
        <textarea id="interests" rows="2" placeholder="e.g. Loves gardening..." required></textarea>
      </div>

      <div class="form-group">
        <label for="avoid">What to AVOID *</label>
        <textarea id="avoid" rows="2" placeholder="e.g. Already has lots of mugs..." required></textarea>
      </div>

      <h4 class="form-section-title">3. Your Information</h4>

      <div class="form-row">
        <div class="form-group">
          <label for="user-name">Your Name </label>
          <input type="text" id="user-name" placeholder="e.g. Acquintence" optional />
        </div>

        <div class="form-group">
          <label for="user-contact">Your Email or Mobile Number *</label>
          <input type="text" id="user-contact" placeholder="e.g. name@example.com or 9876543210" required />
        </div>
      </div>

      <button type="submit" class="btn btn-gradient btn-block">
        Generate Form Code & Get Unique Gifts &rarr;
      </button>
    </form>
  </main>

  <footer class="footer">
    <p>© 2026 ThoughtfulGifts.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
