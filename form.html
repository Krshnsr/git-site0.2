<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find a Gift | ThoughtfulGifts</title>
  <!-- Optional: Bootstrap if you rely on it -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Your site stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="brand"><a href="index.html">Thoughtful<span>Gifts</span></a></div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="form.html" class="active">Find a Gift</a>
    </nav>
  </header>

  <main class="container">
    <form id="gift-search-form">
      <h4 class="form-section-title">Recipient Details</h4>

      <div class="form-row">
        <div class="form-group">
          <label for="recipient-name">Recipient's Name / Nickname</label>
          <input type="text" id="recipient-name" placeholder="e.g. Rahul or Priya" />
        </div>

        <div class="form-group">
          <label for="max-budget">Max Budget (₹ / Currency)</label>
          <input type="number" id="max-budget" placeholder="5000" min="100" />
        </div>
      </div>

      <div class="form-group">
        <label for="interests">Interests, Passions & Quirks</label>
        <textarea id="interests" rows="2" placeholder="e.g. Loves gardening..."></textarea>
      </div>

      <div class="form-group">
        <label for="avoid">What to AVOID</label>
        <textarea id="avoid" rows="2" placeholder="e.g. Already has lots of mugs..."></textarea>
      </div>

      <h4 class="form-section-title">Your Information</h4>

      <div class="form-row">
        <div class="form-group">
          <label for="user-name">Your Name</label>
          <input type="text" id="user-name" placeholder="e.g. Acquintence" />
        </div>

        <div class="form-group">
          <label for="user-contact">Your Email or Mobile Number</label>
          <input type="text" id="user-contact" placeholder="e.g. name@example.com or 9876543210" />
        </div>
      </div>

      <button type="submit" class="btn btn-gradient btn-block">
        Generate Gift Suggestions &rarr;
      </button>
    </form>
  </main>

  <footer class="footer">
    <p>© 2026 ThoughtfulGifts.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
