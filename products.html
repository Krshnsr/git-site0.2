<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop | ThoughtfulGifts — Budget Picks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .products-hero { text-align:center; padding:36px 0 18px; color:#fff; }
    .product-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin:24px 0 64px; }
    .product-card {
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius:14px; padding:14px; overflow:hidden; display:flex; flex-direction:column; gap:12px;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .product-card:hover { transform:translateY(-6px); box-shadow:0 18px 40px rgba(0,0,0,0.4), 0 0 20px rgba(139,92,246,0.07); }
    .product-thumb { width:100%; height:160px; object-fit:cover; border-radius:10px; background:#0b0f19; }
    .product-title { font-weight:700; font-size:1.05rem; color:#fff; }
    .product-price { color:#ffcfb3; font-weight:800; letter-spacing:0.02em; }
    .product-specs { color: var(--text-muted); font-size:0.9rem; line-height:1.4; flex-grow:1; }
    .product-actions { display:flex; gap:8px; justify-content:space-between; align-items:center; }
    .admin-form { background: rgba(0,0,0,0.35); border-radius:12px; padding:12px; border:1px solid rgba(255,255,255,0.04); margin-bottom:16px; }
    .small-muted { color: var(--text-muted); font-size:0.85rem; }
  </style>
</head>
<body>
  <header class="navbar" role="banner">
    <div class="site-header">
      <div class="brand"><a href="index.html">Thoughtful<span>Gifts</span></a></div>

      <button class="nav-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Toggle navigation">
        ☰
      </button>

      <nav id="primary-navigation" class="nav-primary" role="navigation" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="form.html">Find a Gift</a>
        <a href="products.html" class="active">Shop <span id="nav-cart-count" class="cart-badge" aria-label="Product count">0</span></a>
        <a href="local-shop.html">Local</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="products-hero">
      <h1>Budget-Friendly Picks</h1>
      <p class="small-muted">Add items below — each card supports an image, price and short specifications.</p>
    </section>

    <section class="admin-form" aria-label="Add product">
      <form id="add-product-form">
        <div class="row g-2">
          <div class="col-md-4"><input type="text" id="prod-title" class="form-control" placeholder="Product title" required /></div>
          <div class="col-md-2"><input type="number" id="prod-price" class="form-control" placeholder="Price (₹)" required min="0" /></div>
          <div class="col-md-3"><input type="text" id="prod-image" class="form-control" placeholder="Image URL (or leave blank)" /></div>
          <div class="col-md-3"><input type="text" id="prod-tags" class="form-control" placeholder="Short specs / tags" /></div>
          <div class="col-12 mt-2"><textarea id="prod-desc" class="form-control" rows="2" placeholder="Short description / specifications"></textarea></div>
          <div class="col-12 d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-gradient">Add Product</button>
            <button type="button" id="clear-products" class="btn btn-outline">Clear All</button>
            <div id="form-msg" class="small-muted ms-auto align-self-center"></div>
          </div>
        </div>
      </form>
    </section>

    <section>
      <div id="products-count" class="small-muted">No products yet.</div>
      <div id="product-grid" class="product-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 ThoughtfulGifts.</p>
  </footer>

  <script src="nav.js"></script>
  <script src="products.js"></script>
</body>
</html>
