<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            min-height: 100vh;
            min-height: 100svh;
            padding: 8px;
            font-family: sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        canvas {
            width: min(800px, calc(100vw - 16px), calc((100svh - 90px) * 4 / 3));
            height: auto;
            background-color: #111;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: none;
            touch-action: none;
        }

        #controlsHelp {
            margin: 0;
            color: #cccccc;
            font-size: 14px;
            text-align: center;
        }

        #retryButton {
            border: 0;
            border-radius: 6px;
            padding: 11px 22px;
            background: #00adb5;
            color: #ffffff;
            font: bold 16px sans-serif;
            cursor: pointer;
        }

        #retryButton:hover,
        #retryButton:focus-visible {
            background: #08c5ce;
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        }

        #retryButton[hidden] {
            display: none;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600" tabindex="0" aria-label="Brick Breaker game"></canvas>
<p id="controlsHelp">Move: mouse, touch, ← / →, or A / D · Retry: button or Enter</p>
<button id="retryButton" type="button" hidden>Retry Game</button>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const retryButton = document.getElementById("retryButton");

// Game State
let score = 0;
let level = 1;
const maxLevel = 5;
let gameOver = false;
let gameWon = false;
const keys = { left: false, right: false };

// Ball Properties
const ball = {
    x: canvas.width / 2,
    y: canvas.height - 50,
    radius: 8,
    speed: 6,
    dx: 4,
    dy: -4
};

// Paddle Properties
const paddle = {
    height: 15,
    width: 100,
    x: (canvas.width - 100) / 2,
    y: canvas.height - 30,
    color: "#00adb5"
};

// Brick Grid Properties
const brickColumnCount = 9;
const brickWidth = 75;
const brickHeight = 20;
const brickPadding = 10;
const brickOffsetTop = 50;
const brickOffsetLeft = 35;

// Brick Colors by Row (Top to Bottom)
const rowColors = ["#ff2e63", "#ff6b6b", "#feca57", "#1dd1a1", "#54a0ff", "#a55eea", "#26de81", "#45aaf2"];

// Build a fresh brick layout. Each new level adds a row, up to eight rows.
const bricks = [];
function createBricks() {
    const rowCount = Math.min(4 + level, rowColors.length);
    bricks.length = 0;

    for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < rowCount; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1, color: rowColors[r] };
        }
    }
}

function resetBallForLevel() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height - 50;
    ball.speed = 6 + (level - 1) * 0.5;
    const startingVelocity = 4 + (level - 1) * 0.4;
    ball.dx = startingVelocity;
    ball.dy = -startingVelocity;
    paddle.x = (canvas.width - paddle.width) / 2;
}

function startNextLevel() {
    if (level >= maxLevel) {
        gameWon = true;
        return;
    }

    level++;
    createBricks();
    resetBallForLevel();
}

// Convert screen coordinates to the canvas's 800x600 game coordinates.
function movePaddleToPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const relativeX = (e.clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relativeX - paddle.width / 2));
}

// Pointer events support mouse, touch, and stylus with one set of handlers.
canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    canvas.focus();
    movePaddleToPointer(e);
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    if (gameOver || gameWon) restartGame();
});

canvas.addEventListener("pointermove", (e) => {
    // Mouse can steer by hovering; touch/stylus steers while pressed.
    if (e.pointerType === "mouse" || e.buttons > 0) {
        movePaddleToPointer(e);
    }
});

canvas.addEventListener("pointerup", (e) => {
    if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
    }
});

// Keyboard paddle controls and keyboard restart.
document.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    if (["arrowleft", "arrowright", " "].includes(key)) e.preventDefault();

    if (key === "arrowleft" || key === "a") keys.left = true;
    if (key === "arrowright" || key === "d") keys.right = true;
    if (key === "enter" && (gameOver || gameWon)) restartGame();
});

document.addEventListener("keyup", (e) => {
    const key = e.key.toLowerCase();
    if (key === "arrowleft" || key === "a") keys.left = false;
    if (key === "arrowright" || key === "d") keys.right = false;
});

function restartGame() {
    if (!gameOver && !gameWon) return;

    score = 0;
    level = 1;
    gameOver = false;
    gameWon = false;
    keys.left = false;
    keys.right = false;
    createBricks();
    resetBallForLevel();
    retryButton.hidden = true;
    requestAnimationFrame(draw);
}

retryButton.addEventListener("click", restartGame);

// Collision Detection: Ball vs Bricks
function collisionDetection() {
    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < bricks[c].length; r++) {
            const b = bricks[c][r];
            if (b.status === 1 &&
                ball.x + ball.radius > b.x &&
                ball.x - ball.radius < b.x + brickWidth &&
                ball.y + ball.radius > b.y &&
                ball.y - ball.radius < b.y + brickHeight) {
                ball.dy = -ball.dy;
                b.status = 0;
                score += 10;
                break;
            }
        }
    }

    const remainingBricks = bricks.reduce(
        (total, column) => total + column.filter((brick) => brick.status === 1).length,
        0
    );

    if (remainingBricks === 0) startNextLevel();
}

// Drawing Functions
function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.closePath();
}

function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
    ctx.fillStyle = paddle.color;
    ctx.fill();
    ctx.closePath();
}

function drawBricks() {
    for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < bricks[c].length; r++) {
            const brick = bricks[c][r];
            if (brick.status === 1) {
                const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                brick.x = brickX;
                brick.y = brickY;

                ctx.beginPath();
                ctx.rect(brickX, brickY, brickWidth, brickHeight);
                ctx.fillStyle = brick.color;
                ctx.fill();
                ctx.closePath();
            }
        }
    }
}

function drawScore() {
    ctx.font = "16px sans-serif";
    ctx.fillStyle = "#eeeeee";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 30);
    ctx.textAlign = "right";
    ctx.fillText("Level: " + level + " / " + maxLevel, canvas.width - 20, 30);
    ctx.textAlign = "start";
}

function drawScreenMessage(title, subtitle) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = "bold 40px sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);

    ctx.font = "20px sans-serif";
    ctx.fillStyle = "#aaaaaa";
    ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = "start";
}

// Main Game Loop
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Keyboard controls
    if (keys.left) paddle.x -= 7;
    if (keys.right) paddle.x += 7;
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

    drawBricks();
    drawBall();
    drawPaddle();
    drawScore();

    if (gameOver) {
        drawScreenMessage("GAME OVER", "Use the Retry Game button below");
        retryButton.hidden = false;
        return;
    }

    if (gameWon) {
        drawScreenMessage("YOU WIN!", "You completed all levels!");
        retryButton.hidden = false;
        return;
    }

    collisionDetection();

    if (gameWon) {
        drawScreenMessage("YOU WIN!", "You completed all levels!");
        retryButton.hidden = false;
        return;
    }

    // Wall Collision Detection (Left / Right)
    if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
        ball.dx = -ball.dx;
    }

    // Wall Collision Detection (Top)
    if (ball.y + ball.dy < ball.radius) {
        ball.dy = -ball.dy;
    }
    // Bottom collision handling (Paddle or Floor)
    else if (ball.y + ball.dy > canvas.height - ball.radius) {
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
            const hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
            ball.dx = hitPoint * ball.speed;
            ball.dy = -Math.abs(ball.dy);
            ball.y = paddle.y - ball.radius;
        } else {
            gameOver = true;
            drawScreenMessage("GAME OVER", "Use the Retry Game button below");
            retryButton.hidden = false;
            return;
        }
    }

    ball.x += ball.dx;
    ball.y += ball.dy;

    requestAnimationFrame(draw);
}

// Start the game loop automatically on load
createBricks();
resetBallForLevel();
draw();
</script>

</body>
</html>
